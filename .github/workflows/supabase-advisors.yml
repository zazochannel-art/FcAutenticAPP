name: Consultanții Supabase

# Analiza de securitate a bazei se rula doar când și-o amintea cineva. Așa a
# stat luni de zile o funcție apelabilă fără autentificare. De aici încolo,
# săptămânal — și la cerere, când vrei să verifici după o schimbare de schemă.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  advisors:
    runs-on: ubuntu-latest
    # Fără jeton nu are ce interoga; sari peste, în loc să pici degeaba.
    if: ${{ github.repository_owner != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Cere analiza de securitate
        id: fetch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Lipsesc secretele SUPABASE_ACCESS_TOKEN și SUPABASE_PROJECT_REF."
            echo "Adaugă-le în Settings → Secrets → Actions ca verificarea să pornească."
            exit 0
          fi
          curl -sS -f \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/advisors/security" \
            -o advisors.json
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Pică la avertismente de securitate
        if: steps.fetch.outputs.ran == 'true'
        run: |
          node -e '
            const data = require("./advisors.json");
            const lints = data.lints || [];
            const bad = lints.filter((l) => l.level === "ERROR" || l.level === "WARN");
            if (!bad.length) {
              console.log("Nicio problemă de securitate raportată.");
              process.exit(0);
            }
            console.error("Consultanții au raportat " + bad.length + " problemă(e):\n");
            bad.forEach((l) => console.error("  • [" + l.level + "] " + l.title + " — " + (l.detail || "").slice(0, 160)));
            process.exit(1);
          '
