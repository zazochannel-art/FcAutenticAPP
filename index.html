<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />

      html, body, #root { width: 100%; min-height: 100%; height: 100%; margin: 0; }

      .boot-text { margin-top: 8px; color: #94AFC2; font-size: 13px; }
    </style>

      <div class="boot-screen">
        <div class="boot-card">
          <img class="boot-logo" src="/icon-square.png" alt="FC Autentic" />
          <div class="boot-title">FC Autentic</div>
          <div class="boot-text">Se încarcă aplicația...</div>
